<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --wood: #3E2723;
    --wood-2: #4E342E;
    --wood-3: #5D4037;
    --brass: #C9A227;
    --cream: #F0E6D2;
    --cream-dim: #C9BBA0;
    --lamp-green: #4CAF50;
    --lamp-red: #E53935;
  }

  * { box-sizing: border-box; }

  #ask-root {
    font-family: 'Inter', sans-serif;
    background: var(--wood);
    background-image: radial-gradient(circle at 1px 1px, rgba(240,230,210,0.05) 1px, transparent 0);
    background-size: 16px 16px;
    color: var(--cream);
    padding: 32px 20px 48px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .masthead {
    width: 100%;
    max-width: 680px;
    text-align: left;
    margin-bottom: 26px;
  }

  .eyebrow {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 0.2em;
    color: var(--brass);
    margin-bottom: 6px;
  }

  .masthead h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 40px;
    letter-spacing: 0.01em;
    margin: 0 0 8px 0;
    color: var(--cream);
    line-height: 1.1;
  }

  .masthead p {
    margin: 0;
    font-size: 14.5px;
    color: var(--cream-dim);
    max-width: 54ch;
  }

  .panel {
    width: 100%;
    max-width: 680px;
    background: var(--wood-2);
    border: 1px solid var(--wood-3);
    padding: 26px;
  }

  .field-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 0.1em;
    color: var(--brass);
    margin-bottom: 10px;
    display: block;
  }

  .jack-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .jack-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    background: var(--wood);
    border: 1px solid var(--wood-3);
    color: var(--cream-dim);
    padding: 9px 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    border-radius: 2px;
  }

  .jack-btn.active {
    background: var(--brass);
    border-color: var(--brass);
    color: var(--wood);
    font-weight: 600;
  }

  .urgency-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .urgency-btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 0.05em;
    background: var(--wood);
    border: 1px solid var(--wood-3);
    color: var(--cream-dim);
    padding: 8px 18px;
    cursor: pointer;
    flex: 1;
    transition: all 0.15s ease;
  }

  .urgency-btn.active {
    background: var(--wood-3);
    border-color: var(--brass);
    color: var(--cream);
  }

  textarea, input[type="email"] {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 12px;
    border: 1px solid var(--wood-3);
    background: var(--wood);
    color: var(--cream);
    margin-bottom: 18px;
    resize: vertical;
  }

  textarea { min-height: 100px; }

  textarea:focus, input:focus, .jack-btn:focus, .urgency-btn:focus, .primary-btn:focus {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  .action-row { display: flex; justify-content: flex-end; }

  .primary-btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 0.08em;
    background: var(--brass);
    color: var(--wood);
    border: none;
    padding: 13px 28px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .primary-btn:hover:not(:disabled) { background: #ddb945; }
  .primary-btn:active:not(:disabled) { transform: translateY(1px); }
  .primary-btn:disabled { opacity: 0.45; cursor: wait; }

  .error-box {
    margin-top: 16px;
    border: 1px solid var(--lamp-red);
    color: #ff8a80;
    background: rgba(229,57,53,0.08);
    padding: 12px 14px;
    font-size: 13px;
  }

  .result {
    margin-top: 24px;
    border-top: 1px dashed var(--wood-3);
    padding-top: 22px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  .lamp {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--lamp-green);
    box-shadow: 0 0 12px 3px rgba(76,175,80,0.7);
    flex-shrink: 0;
    margin-top: 4px;
    animation: glow 1.6s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from { box-shadow: 0 0 8px 2px rgba(76,175,80,0.5); }
    to { box-shadow: 0 0 16px 5px rgba(76,175,80,0.9); }
  }

  .result-text .headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 0.03em;
    color: var(--cream);
    margin-bottom: 6px;
  }

  .result-text .meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--cream-dim);
    line-height: 1.7;
  }

  .result-text .meta span { color: var(--brass); }
</style>

<div id="ask-root">
  <div class="masthead">
    <div class="eyebrow">ASKANEXPERT — SWITCHBOARD</div>
    <h1>Get plugged in to the right expert.</h1>
    <p>Pick what your question's about, describe it, and the switchboard routes it to a matching AWS expert — no browsing, no guessing who to ask.</p>
  </div>

  <div class="panel">
    <span class="field-label">Category</span>
    <div class="jack-row" id="categoryRow">
      <button class="jack-btn active" data-cat="Networking">Networking</button>
      <button class="jack-btn" data-cat="Security">Security</button>
      <button class="jack-btn" data-cat="Cost">Cost</button>
      <button class="jack-btn" data-cat="Serverless">Serverless</button>
      <button class="jack-btn" data-cat="Data">Data</button>
      <button class="jack-btn" data-cat="General">General</button>
    </div>

    <span class="field-label">Urgency</span>
    <div class="urgency-row" id="urgencyRow">
      <button class="urgency-btn active" data-urg="Instant">Instant</button>
      <button class="urgency-btn" data-urg="Async">Async (reply when free)</button>
    </div>

    <span class="field-label">Your question</span>
    <textarea id="questionInput" placeholder="What are you stuck on?"></textarea>

    <span class="field-label">Your email</span>
    <input type="email" id="emailInput" placeholder="you@example.com" />

    <div class="action-row">
      <button class="primary-btn" id="submitBtn">Connect the call</button>
    </div>

    <div id="errorArea"></div>
    <div id="resultArea"></div>
  </div>
</div>

<script>
  let currentCategory = 'Networking';
  let currentUrgency = 'Instant';

  document.getElementById('categoryRow').addEventListener('click', (e) => {
    const btn = e.target.closest('.jack-btn');
    if (!btn) return;
    document.querySelectorAll('.jack-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = btn.dataset.cat;
  });

  document.getElementById('urgencyRow').addEventListener('click', (e) => {
    const btn = e.target.closest('.urgency-btn');
    if (!btn) return;
    document.querySelectorAll('.urgency-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentUrgency = btn.dataset.urg;
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  const LAMBDA_URL = "https://stypmp5pok4rrmlwjwwaxiusji0capmh.lambda-url.eu-north-1.on.aws/";

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const errorArea = document.getElementById('errorArea');
    const resultArea = document.getElementById('resultArea');
    const btn = document.getElementById('submitBtn');
    const question = document.getElementById('questionInput').value.trim();
    const email = document.getElementById('emailInput').value.trim();

    errorArea.innerHTML = '';
    resultArea.innerHTML = '';

    if (!question || !email) {
      errorArea.innerHTML = '<div class="error-box">Fill in your question and email first — the switchboard needs both to make the connection.</div>';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Connecting…';

    try {
      const response = await fetch(LAMBDA_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, category: currentCategory, urgency: currentUrgency, email })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || ('Request failed with status ' + response.status));

      resultArea.innerHTML = `
        <div class="result">
          <div class="lamp"></div>
          <div class="result-text">
            <div class="headline">Connected to ${escapeHtml(data.matchedExpertName)}</div>
            <div class="meta">
              SPECIALTY: <span>${escapeHtml(data.specialty)}</span><br/>
              URGENCY: <span>${escapeHtml(data.urgency)}</span><br/>
              TICKET: <span>${escapeHtml(data.ticketId)}</span><br/>
              Confirmation sent to ${escapeHtml(email)}
            </div>
          </div>
        </div>
      `;
    } catch (err) {
      errorArea.innerHTML = '<div class="error-box">Couldn\'t make the connection: ' + escapeHtml(err.message) + '</div>';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Connect the call';
    }
  });
</script>
